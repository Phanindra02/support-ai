[project]
name = "support-ai"
version = "0.1.0"
description = "AI customer support platform: ticket API, WhatsApp bot, RAG, and ML triage"
readme = "README.md"
authors = [
    { name = "Phanindra", email = "60551624+Phanindra02@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "boto3>=1.43.118",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.1",
    "twilio>=9.12.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "faker>=40.43.0",
    "httpx2>=2.14.0",
    "moto[s3]>=5.2.4",
    "pandas>=3.0.6",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
# The project isn't installed as a package, so this lets tests import app from the project root.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
# The code is written to 100 columns.
line-length = 100

[tool.ruff.lint]
# Ruff's default rules, minus UP017, which would turn timezone.utc into datetime.UTC.
# The project writes datetime.now(timezone.utc) (see CLAUDE.md).
ignore = ["UP017"]

[tool.ruff.lint.isort]
# The alembic/ folder holds migrations, not the alembic library, which `from alembic import op`
# means. Without this, ruff would sort that import in with the project's own.
known-third-party = ["alembic"]
