# Lints and tests every push, to any branch, then builds the API's and the model service's
# images. Pushes to main also publish both to Amazon ECR, where EC2 pulls them from.
name: CI

on:
  push:

# The token GitHub gives each job can only read the repo, unless a job asks for more.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The same uv as on the Mac and in infra/api.Dockerfile. It also caches downloaded
      # packages between runs, keyed on uv.lock. setup-uv only publishes exact versions, with
      # no v10 tag that moves to each release, so it's pinned to one.
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          version: "0.13.2"
      # --locked fails if uv.lock is out of date with pyproject.toml, instead of updating it.
      - run: uv sync --locked
      - run: uv run ruff check .

  test:
    runs-on: ubuntu-latest
    # Postgres and Redis run as containers next to the job, reachable on localhost. The job
    # waits until both pass their health checks.
    services:
      postgres:
        # The same Postgres and pgvector as docker-compose.yml, the Mac, and RDS.
        image: pgvector/pgvector:0.8.2-pg16
        env:
          # A throwaway database that only exists for this run, so the password isn't a secret.
          POSTGRES_USER: support
          POSTGRES_PASSWORD: support
          POSTGRES_DB: support_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U support -d support_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    # The settings that .env holds on the Mac. The tests only use the TEST_ ones, but the app
    # won't start without DATABASE_URL and REDIS_URL, and the tests refuse to run if the two
    # pairs match.
    env:
      DATABASE_URL: postgresql+psycopg://support:support@localhost:5432/support
      TEST_DATABASE_URL: postgresql+psycopg://support:support@localhost:5432/support_test
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          version: "0.13.2"
      - run: uv sync --locked
      # tests/test_k8s.py renders the Helm chart. The same version as on the Mac, so a chart
      # that works there renders the same here.
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.1
      # A new random key for every run, so no key is written in the repo for anyone to copy.
      - name: Make a JWT secret for this run
        run: echo "JWT_SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: uv run pytest

  image:
    # Only once lint and the tests pass, so a broken commit never becomes an image.
    needs: [lint, test]
    # An ARM machine, like the Mac and AWS Graviton, so the image is built for the CPU it
    # runs on, without emulation.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      # Lets the job ask GitHub for a signed token that says which repo and branch it runs
      # for, which AWS swaps for short-lived credentials. It gives no write access to anything.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # Built on every branch, so a broken Dockerfile shows up before it reaches main. The
      # layers are cached in GitHub Actions' cache, so unchanged ones aren't rebuilt. There
      # are no build args: settings and secrets only reach a container when it runs.
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/api.Dockerfile
          load: true
          tags: support-ai-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Postgres and Redis aren't needed for this: the app starts without them, and GET /
      # skips the rate limit when Redis is down.
      - name: Check that the image runs, and not as root
        run: |
          test "$(docker run --rm support-ai-api:ci id -u)" != 0
          docker run -d --name api -p 8000:8000 \
            -e DATABASE_URL=postgresql+psycopg://nobody@localhost/none \
            -e REDIS_URL=redis://localhost:1/0 \
            -e JWT_SECRET_KEY="$(openssl rand -hex 32)" \
            support-ai-api:ci
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 1 \
            http://localhost:8000/
          docker rm -f api

      # The model service's image (infra/model.Dockerfile). Its own cache scope, so the two
      # builds don't overwrite each other's cached layers.
      - name: Build the model image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/model.Dockerfile
          load: true
          tags: support-ai-model:ci
          cache-from: type=gha,scope=model
          cache-to: type=gha,mode=max,scope=model

      # CI has no saved models, and the service won't start without them, so this checks the
      # user and that every module the service needs is in the image.
      - name: Check that the model image has its code, and doesn't run as root
        run: |
          test "$(docker run --rm support-ai-model:ci id -u)" != 0
          docker run --rm support-ai-model:ci python -c "import ml.service"

      # From here on, only for pushes to main, which is what a merged pull request is. The
      # role's trust policy (infra/aws/github-ci-trust-policy.json) refuses every other branch,
      # so these steps would fail anywhere else anyway. No AWS keys are stored in GitHub.
      - name: Log in to AWS as the CI role
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          # A repo variable rather than written here, so the public repo doesn't show the
          # account number. The account number is also masked in the logs.
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-2
          mask-aws-account-id: true

      - name: Log in to ECR
        if: github.ref == 'refs/heads/main'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Two tags: sha-<commit> never changes (ECR refuses to overwrite it), so a deploy or
      # rollback can name an exact build, and latest moves to each new build. The labels link
      # the image to this repo on GitHub.
      - name: Choose tags and labels
        if: github.ref == 'refs/heads/main'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.ecr.outputs.registry }}/support-ai-api
          tags: |
            type=sha
            type=raw,value=latest

      # The same build as above, so every layer comes from the cache.
      - name: Push the image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/api.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # Without this, buildx adds a build record that ECR lists as a second, untagged image
          # beside each real one. A plain image keeps the registry to one image per build.
          provenance: false

      # The same two tags for the model image, so one commit names both images.
      - name: Choose the model image's tags and labels
        if: github.ref == 'refs/heads/main'
        id: model-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.ecr.outputs.registry }}/support-ai-model
          tags: |
            type=sha
            type=raw,value=latest

      - name: Push the model image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/model.Dockerfile
          push: true
          tags: ${{ steps.model-meta.outputs.tags }}
          labels: ${{ steps.model-meta.outputs.labels }}
          cache-from: type=gha,scope=model
          provenance: false

  # Puts each new image on the EC2 server. CI asks AWS Systems Manager to run the deploy
  # document there (infra/aws/deploy-document.json), so no port is opened and no SSH key is
  # stored in GitHub. The CI role may run only that document, only on that server.
  deploy:
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One deploy at a time, in merge order. A newer one waits instead of cutting one off.
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      INSTANCE_ID: ${{ vars.SERVER_INSTANCE_ID }}
    steps:
      - name: Log in to AWS as the CI role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-2
          mask-aws-account-id: true

      # The image job pushed sha-<first 7 of this commit>, which the document runs.
      - name: Deploy this commit on the server
        run: |
          id=$(aws ssm send-command --document-name support-ai-deploy \
            --instance-ids "$INSTANCE_ID" --parameters "commit=$GITHUB_SHA" \
            --comment "Deploy $GITHUB_SHA" --query Command.CommandId --output text)
          # Checks every 5 seconds, for up to 100. A failed deploy shows its output below.
          aws ssm wait command-executed --command-id "$id" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query '[Status, StandardOutputContent, StandardErrorContent]' --output text
          status=$(aws ssm get-command-invocation --command-id "$id" \
            --instance-id "$INSTANCE_ID" --query Status --output text)
          test "$status" = Success

      - name: Check the live API answers over HTTPS
        run: |
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 3 \
            https://support.mysolospark.com/
