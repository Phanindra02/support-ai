# Lints and tests every push, to any branch, then builds the API's image. Pushes to main also
# publish the image to GitHub Container Registry.
name: CI

on:
  push:

# The token GitHub gives each job can only read the repo, unless a job asks for more.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The same uv as on the Mac and in infra/api.Dockerfile. It also caches downloaded
      # packages between runs, keyed on uv.lock. setup-uv only publishes exact versions, with
      # no v10 tag that moves to each release, so it's pinned to one.
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          version: "0.13.2"
      # --locked fails if uv.lock is out of date with pyproject.toml, instead of updating it.
      - run: uv sync --locked
      - run: uv run ruff check .

  test:
    runs-on: ubuntu-latest
    # Postgres and Redis run as containers next to the job, reachable on localhost. The job
    # waits until both pass their health checks.
    services:
      postgres:
        # The same major version as on the Mac and in docker-compose.yml.
        image: postgres:16
        env:
          # A throwaway database that only exists for this run, so the password isn't a secret.
          POSTGRES_USER: support
          POSTGRES_PASSWORD: support
          POSTGRES_DB: support_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U support -d support_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    # The settings that .env holds on the Mac. The tests only use the TEST_ ones, but the app
    # won't start without DATABASE_URL and REDIS_URL, and the tests refuse to run if the two
    # pairs match.
    env:
      DATABASE_URL: postgresql+psycopg://support:support@localhost:5432/support
      TEST_DATABASE_URL: postgresql+psycopg://support:support@localhost:5432/support_test
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          version: "0.13.2"
      - run: uv sync --locked
      # A new random key for every run, so no key is written in the repo for anyone to copy.
      - name: Make a JWT secret for this run
        run: echo "JWT_SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: uv run pytest

  image:
    # Only once lint and the tests pass, so a broken commit never becomes an image.
    needs: [lint, test]
    # An ARM machine, like the Mac and AWS Graviton, so the image is built for the CPU it
    # runs on, without emulation.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write # to push to GitHub Container Registry
    env:
      # Registry names must be lowercase, so this can't come from github.repository_owner.
      IMAGE: ghcr.io/phanindra02/support-ai-api
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # Built on every branch, so a broken Dockerfile shows up before it reaches main. The
      # layers are cached in GitHub Actions' cache, so unchanged ones aren't rebuilt. There
      # are no build args: settings and secrets only reach a container when it runs.
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/api.Dockerfile
          load: true
          tags: support-ai-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Postgres and Redis aren't needed for this: the app starts without them, and GET /
      # skips the rate limit when Redis is down.
      - name: Check that the image runs, and not as root
        run: |
          test "$(docker run --rm support-ai-api:ci id -u)" != 0
          docker run -d --name api -p 8000:8000 \
            -e DATABASE_URL=postgresql+psycopg://nobody@localhost/none \
            -e REDIS_URL=redis://localhost:1/0 \
            -e JWT_SECRET_KEY="$(openssl rand -hex 32)" \
            support-ai-api:ci
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 1 \
            http://localhost:8000/
          docker rm -f api

      # From here on, only for pushes to main, which is what a merged pull request is.
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags: sha-<commit> never changes, so a deploy or rollback can name an exact build,
      # and latest moves to each new build. The labels link the image to this repo on GitHub.
      - name: Choose tags and labels
        if: github.ref == 'refs/heads/main'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest

      # The same build as above, so every layer comes from the cache.
      - name: Push the image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/api.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
