# Brings the database up to the latest migration, then exits, like compose's migrate service.
# A Job runs a pod until it succeeds, rather than keeping it running like a Deployment.
#
# A Job can't be changed once it exists, so run it again by deleting it first:
#   kubectl delete job migrate --ignore-not-found && kubectl apply -f infra/k8s/migrate.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
spec:
  # Tries 3 more times if it fails, say because the database isn't up yet.
  backoffLimit: 3
  template:
    spec:
      # Never restart the container in place. A failed try gets a new pod, up to backoffLimit.
      restartPolicy: Never
      containers:
        - name: migrate
          image: support-ai-api
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: support-ai-settings
            - secretRef:
                name: support-ai-secrets
