# The identities the pods run as. On EKS, Pod Identity gives each its own IAM role
# (infra/k8s/eks-cluster.yaml): the app's may save uploads, read document text, and read the
# keys in Parameter Store, and the model service's may only read its models. On minikube they
# have no role, and nothing needs one.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: support-ai-app
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: support-ai-model
