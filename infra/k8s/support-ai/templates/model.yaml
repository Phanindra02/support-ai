# The model service: predicts priority and sentiment for the worker (ml/service.py), from its
# own image, infra/model.Dockerfile.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model
  labels:
    app: model
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model
  template:
    metadata:
      labels:
        app: model
    spec:
      serviceAccountName: support-ai-model
      containers:
        - name: model
          image: "{{ .Values.image.model }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          # Its own few settings, and not the API's Secret, so none of the API's keys reach it.
          envFrom:
            - configMapRef:
                name: model-settings
          # 149 MB on the server, and 268 MB on the Mac. Loading the models takes more.
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          # The service listens only once both models are loaded, which includes downloading
          # them from S3 the first time. The other probes wait until this passes, for up to
          # 2 minutes, rather than restarting a pod that's still downloading.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: models
              mountPath: /models
              {{- if .Values.model.hostPath }}
              readOnly: true
              {{- end }}
      volumes:
        - name: models
          {{- if .Values.model.hostPath }}
          # On minikube, the models ml.save wrote on the Mac, which minikube start mounts into
          # minikube (infra/k8s/README.md), so the pod needs no AWS keys, as in compose.
          hostPath:
            path: {{ .Values.model.hostPath }}
            type: Directory
          {{- else }}
          # On EKS, empty when the pod starts, so the service downloads its models from S3
          # into it with the pod's IAM role. It lasts as long as the pod.
          emptyDir: {}
          {{- end }}
---
# Only the worker calls it, at http://model:8000.
apiVersion: v1
kind: Service
metadata:
  name: model
spec:
  selector:
    app: model
  ports:
    - name: http
      port: 8000
      targetPort: http
