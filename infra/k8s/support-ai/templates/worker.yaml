# The worker: runs the jobs the API puts on the queue in Redis (worker/main.py). The API's
# image and settings, with another command.
#
# No Service: nothing calls the worker. It asks Redis for the next job itself, so more pods
# would share the queue without any load balancer.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      serviceAccountName: support-ai-app
      # On a stop, RQ finishes the job it's running before it exits. Kubernetes' default 30
      # seconds could cut a long job off halfway, as compose's 10 could.
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: "{{ .Values.image.api }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "worker.main"]
          envFrom:
            - configMapRef:
                name: support-ai-settings
            {{- if .Values.secretName }}
            - secretRef:
                name: {{ .Values.secretName }}
            {{- end }}
          # 79 MB on the server between jobs. A job runs in a copy of the worker, which needs
          # room of its own.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # The worker answers no HTTP, so Kubernetes runs worker/health.py in the container
          # instead: it fails once RQ's heartbeat for this pod is gone from Redis. Python takes
          # a second or two to start, so the default 1-second timeout would fail it.
          # No readiness probe: that only decides which pods a Service sends requests to.
          livenessProbe:
            exec:
              command: ["python", "-m", "worker.health"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
