# The EC2 server's changes to docker-compose.yml: the database is RDS, not a container.
#
# The server's .env turns this file on with the line below, so a plain `docker compose up`
# there reads both files, and this one's keys replace the same keys in docker-compose.yml:
#   COMPOSE_FILE=docker-compose.yml:infra/aws/compose.ec2.yml

services:
  api:
    environment:
      # The RDS URL, which the server's .env holds (infra/aws/README.md). Required, so a
      # server without it stops here instead of starting against a database that isn't there.
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env to the RDS URL}

  migrate:
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env to the RDS URL}
    # RDS is always up, so there's no container to wait for. !reset drops the wait for the
    # postgres container that docker-compose.yml sets.
    depends_on: !reset {}

  # A service with a profile only starts when that profile is asked for, so `docker compose up`
  # leaves Postgres out on the server.
  postgres:
    profiles: [local-postgres]
